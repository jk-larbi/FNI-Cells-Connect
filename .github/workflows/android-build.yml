name: Build FNI Cells Connect Android APK

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fni-cells-android-build
  cancel-in-progress: true

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: |
            platform-tools
            platforms;android-35
            build-tools;35.0.0

      - name: Install web dependencies
        run: npm ci

      - name: Install Capacitor 8 for the native build
        run: npm install --no-save --package-lock=false @capacitor/core@^8 @capacitor/android@^8 @capacitor/cli@^8

      - name: Build web assets for Android
        run: npm run build
        env:
          CAPACITOR_BUILD: 'true'
          VITE_SUPABASE_URL: https://cjskjazsrrbfyjepwyxa.supabase.co
          VITE_SUPABASE_ANON_KEY: sb_publishable_0nQJMgCvgruw3CXX9YpBIg_Jq2rAx-Q

      - name: Generate Android project and sync web assets
        run: |
          npx cap add android
          npx cap sync android

      - name: Build Android debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: fni-cells-connect-android-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
