name: Deploy FNI Cells Connect to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run regression tests
        run: |
          npm run test:fni
          npm run test:notifications

      - name: Build application
        run: npm run build
        env:
          VITE_SUPABASE_URL: https://cjskjazsrrbfyjepwyxa.supabase.co
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Verify published site and built assets
        env:
          PAGES_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          set -euo pipefail

          if [ -z "${PAGES_URL}" ]; then
            echo "::error::GitHub Pages did not return a published URL."
            exit 1
          fi

          echo "Checking published page: ${PAGES_URL}"
          curl --fail --location --silent --show-error \
            --retry 10 --retry-all-errors --retry-delay 5 \
            --connect-timeout 15 --max-time 60 \
            "${PAGES_URL}" --output /tmp/fni-pages-index.html

          if ! grep -Fq '<div id="root"></div>' /tmp/fni-pages-index.html; then
            echo "::error::Published HTML is missing the React application root."
            exit 1
          fi

          JS_PATH="$(grep -oE 'src="[^"]+\.js"' /tmp/fni-pages-index.html | head -n 1 | cut -d '"' -f 2 || true)"
          CSS_PATH="$(grep -oE 'href="[^"]+\.css"' /tmp/fni-pages-index.html | head -n 1 | cut -d '"' -f 2 || true)"

          if [ -z "${JS_PATH}" ]; then
            echo "::error::No built JavaScript bundle was found in the published HTML."
            exit 1
          fi

          PAGES_ORIGIN="$(printf '%s' "${PAGES_URL}" | sed -E 's#^(https?://[^/]+).*#\1#')"
          for ASSET_PATH in "${JS_PATH}" "${CSS_PATH}"; do
            [ -z "${ASSET_PATH}" ] && continue
            case "${ASSET_PATH}" in
              http://*|https://*) ASSET_URL="${ASSET_PATH}" ;;
              /*) ASSET_URL="${PAGES_ORIGIN}${ASSET_PATH}" ;;
              *) ASSET_URL="${PAGES_URL%/}/${ASSET_PATH}" ;;
            esac
            echo "Checking asset: ${ASSET_URL}"
            curl --fail --location --silent --show-error \
              --retry 5 --retry-all-errors --retry-delay 3 \
              --connect-timeout 15 --max-time 60 \
              "${ASSET_URL}" --output /dev/null
          done

          echo "GitHub Pages HTML and referenced application assets are reachable."
