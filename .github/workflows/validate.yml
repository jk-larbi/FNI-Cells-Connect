name: Validate FNI Cells Connect

on:
  pull_request:
    branches: [main]
  push:
    branches:
      - main
      - feature/google-apple-account-recovery

permissions:
  contents: read

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run TypeScript and production build
        run: npm run build
      - name: Run project tests
        run: npm test
