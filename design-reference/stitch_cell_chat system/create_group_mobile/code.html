<body class="bg-light-surface text-light-on-surface antialiased font-body">
  <div class="min-h-[884px] flex flex-col bg-light-surface" data-stitch-vh="min-h-[884px]===min-h-screen">
    <header class="sticky top-0 z-30 bg-light-surface-container-low border-b border-light-outline-variant px-4 py-3 flex items-center justify-between gap-3">
      <div class="flex items-center gap-3">
        <a href="../messages-mobile/MessagesMobile.html" aria-label="Back to Messages" class="w-8 h-8 rounded-full bg-light-surface-container inline-flex items-center justify-center"><span class="material-symbols-outlined text-title-md" aria-hidden="true">arrow_back</span></a>
        <h1 data-design-text-token="title-lg" class="font-title text-title-lg text-light-on-surface">Create Group</h1>
      </div>
    </header>

    <main class="flex-1 px-4 py-5 flex flex-col gap-4">
      <!-- Group Identity -->
      <article class="rounded-lg bg-light-surface-container-low border border-light-outline-variant p-4 flex flex-col gap-3.5 shadow-[0_1px_2px_rgba(20,40,66,0.04)]">
        <div class="flex items-center gap-3">
          <label class="w-14 h-14 rounded-full bg-light-primary-container text-light-on-primary-container inline-flex items-center justify-center cursor-pointer shrink-0 border border-light-outline-variant">
            <span class="material-symbols-outlined text-title-lg" aria-hidden="true">add_a_photo</span>
            <input type="file" accept="image/*" class="sr-only">
          </label>
          <div class="flex-1 flex flex-col gap-1">
            <label for="cgm-name" class="font-label text-label-md text-light-on-surface">Group name</label>
            <input id="cgm-name" type="text" placeholder="Enter group name" class="rounded-md border-light-outline-variant bg-light-surface text-body-md px-3 py-2">
          </div>
        </div>
        <div class="flex flex-col gap-1">
          <label for="cgm-desc" class="font-label text-label-md text-light-on-surface">Description</label>
          <textarea id="cgm-desc" rows="2" placeholder="Describe the group&#39;s purpose…" class="rounded-md border-light-outline-variant bg-light-surface text-body-md px-3 py-2"></textarea>
        </div>
        <div class="flex flex-col gap-1">
          <label for="cgm-privacy" class="font-label text-label-md text-light-on-surface">Group visibility</label>
          <select id="cgm-privacy" class="rounded-md border-light-outline-variant bg-light-surface text-body-md px-3 py-2">
            <option>Private group</option>
            <option>Restricted group</option>
            <option>Public group</option>
          </select>
        </div>
      </article>

      <!-- Add Members & Roles -->
      <article class="rounded-lg bg-light-surface-container-low border border-light-outline-variant p-4 flex flex-col gap-3 shadow-[0_1px_2px_rgba(20,40,66,0.04)]">
        <h2 class="font-title text-title-md text-light-on-surface">Add Members &amp; Roles</h2>
        <input type="search" placeholder="Search by name or @username…" class="rounded-full border-light-outline-variant bg-light-surface text-body-md px-3.5 py-2">
        <label class="flex items-center justify-between py-1.5"><span class="font-label text-label-md">Abena Boateng (@abena.b)</span><input type="checkbox" checked class="rounded border-light-outline-variant text-light-primary"></label>
        <label class="flex items-center justify-between py-1.5"><span class="font-label text-label-md">Daniel Osei (@daniel.o)</span><input type="checkbox" class="rounded border-light-outline-variant text-light-primary"></label>
      </article>

      <a href="../group-chat-mobile/GroupChatMobile.html" class="w-full py-3 rounded-full bg-light-primary text-light-on-primary font-label text-label-lg text-center shadow-sm">Create Group</a>
    </main>
  </div>
