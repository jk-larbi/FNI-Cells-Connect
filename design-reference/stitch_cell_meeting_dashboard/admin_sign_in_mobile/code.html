<body class="bg-light-surface text-light-on-surface antialiased">
  <div class="min-h-[884px] flex flex-col bg-light-surface" data-stitch-vh="min-h-[884px]===min-h-screen">
    <header class="bg-light-surface-container-low border-b border-light-outline-variant px-4 py-3 flex items-center gap-3">
      <span data-design-text-token="title-lg" class="font-title text-title-lg text-light-on-surface tracking-tight">FNI</span>
      <span class="h-4 w-px bg-light-outline-variant" aria-hidden="true"></span>
      <span data-design-text-token="label-md" class="font-label text-label-md text-light-secondary uppercase">CELLS CONNECT</span>
    </header>

    <main class="flex-1 px-4 py-6 flex flex-col gap-4 max-w-md w-full mx-auto">
      <section class="flex flex-col gap-1">
        <span class="font-label text-label-md text-light-on-surface-variant uppercase">FNI ADMIN · SIGN IN</span>
        <h1 data-design-text-token="headline-lg" class="font-headline text-headline-lg text-light-on-surface">Welcome back.</h1>
        <p class="font-body text-body-md text-light-on-surface-variant">Sign in to your FNI administrator workspace.</p>
      </section>

      <article class="rounded-lg bg-light-surface-container-low border border-light-outline-variant p-4 flex flex-col gap-0.5">
        <h2 class="font-title text-title-md text-light-on-surface">Forerunners Network International</h2>
        <p class="font-body text-body-md text-light-on-surface-variant">A connected network. A shared mission.</p>
      </article>

      <form class="flex flex-col gap-3" action="../overview-mobile/OverviewMobile.html">
        <div class="rounded-lg bg-light-surface-container-low border border-light-outline-variant p-3.5 flex flex-col gap-1">
          <label for="m-username" class="font-label text-label-sm text-light-on-surface-variant">Username or email</label>
          <input id="m-username" type="text" placeholder="Enter your administrator username" class="border-0 bg-transparent p-0 font-body text-body-md text-light-on-surface focus:ring-0">
        </div>

        <div class="rounded-lg bg-light-surface-container-low border border-light-outline-variant p-3.5 flex flex-col gap-1">
          <label for="m-password" class="font-label text-label-sm text-light-on-surface-variant">Password</label>
          <input id="m-password" type="password" placeholder="Enter your password" class="border-0 bg-transparent p-0 font-body text-body-md text-light-on-surface focus:ring-0">
        </div>

        <button data-component-id="button-primary" data-component-type="button" data-component-variant="primary" type="submit" class="w-full py-3 rounded-full bg-light-primary text-light-on-primary font-label text-label-lg mt-1">Sign in</button>
        <button type="button" class="w-full py-3 rounded-full border border-light-outline-variant bg-light-surface-container-low font-label text-label-lg text-light-on-surface">Forgot password?</button>
      </form>

      <p class="font-body text-body-md text-light-on-surface-variant pt-2">Administrator access is provided by your ministry. Need an account? Contact your FNI leadership.</p>
    </main>
  </div>
